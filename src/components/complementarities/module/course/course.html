<template>
    <div class="course">
        <!-- Error message -->
        <div v-if="error" class="notice notice--error">
            <div class="noticeIcon">⚠️</div>
            <div class="noticeText">{{ error }}</div>
        </div>

        <!-- Loading message -->
        <div v-if="loading" class="notice">
            <div class="spinner"></div>
            <div class="noticeText">{{ $t('components.course.loading') }}</div>
        </div>

        <!-- Course content -->
        <template v-if="!loading && !error">
        <!-- Top bar -->
        <header class="topbar">
            <button class="back" @click="goBack" :aria-label="$t('components.course.goBack')">←</button>

            <div class="titleWrap">
                <div class="courseTitle">{{ module.title }}</div>
                <div v-if="dayNumber" class="courseMeta">
                    <span class="chip">{{ $t('components.course.day', { n: dayNumber }) }}</span>
                </div>
            </div>

            <button class="ghost" @click="restart">{{ $t('components.course.restart') }}</button>
        </header>

        <!-- Course progress -->
        <div class="progressRow">
            <div class="progressTrack">
                <div class="progressFill" :style="{ width: progressPercent + '%' }"></div>
            </div>
            <span class="progressLabel">{{ currentIndex + 1 }}/{{ slides.length }}</span>
        </div>

        <!-- Swipeable stage -->
        <section class="stage" :style="{ height: stageHeight }" @touchstart="onTouchStart" @touchmove="onTouchMove" @touchend="onTouchEnd">
            <div class="slides" :style="slidesStyle">
                <article v-for="(slide, i) in slides" :key="slide.id" class="slide">
                    <div class="slideInner">

                        <!-- Card with components -->
                        <template v-if="slide.type === 'card'">
                            <div class="card-header-wrapper">
                                <h2 class="h2">{{ slide.title }}</h2>
                                <audio-button 
                                    v-if="slide.type === 'card'"
                                    :owner-type="'card'" 
                                    :owner-id="slide.cardId" 
                                    class="card-audio-button">
                                </audio-button>
                            </div>
                            <p v-if="slide.subtitle" class="subtitle">{{ slide.subtitle }}</p>

                            <!-- Render components -->
                            <div v-for="comp in slide.components" :key="comp.order" >

                                <div class="component" v-if="shouldShowComponent(comp, slide)">
                                    <!-- Title -->
                                    <div v-if="comp.type === 'title'" class="comp-title">{{ comp.content }}</div>

                                    <!-- Subtitle -->
                                    <div v-if="comp.type === 'subtitle'" class="comp-subtitle">{{ comp.content }}</div>
                                

                                    <!-- Text -->
                                    <div v-if="comp.type === 'text'" class="comp-text">{{ comp.content }}</div>

                                    <!-- Quote -->
                                    <div v-if="comp.type === 'quote'" class="comp-quote">
                                        <div class="quote-text">"{{ comp.content.replace(/"/g, '').replace(/“/g, '').replace(/”/g, '') }}"</div>
                                        <div class="quote-author">— {{ comp.author }}</div>
                                    </div>

                                    <!-- Image -->
                                    <div v-if="comp.type === 'image'" class="comp-image">
                                        <img :src="getImageUrl(comp.url || comp.image)" :alt="comp.alt || $t('components.course.imageAlt')" />
                                        <p v-if="comp.description" class="image-desc">{{ comp.description }}</p>
                                    </div>
                                    <!-- Video -->
                                    <div v-if="comp.type === 'video'" class="comp-video">
                                        <!-- {{$i18n.locale + '_' + comp.url.split('_')[1]}} -->
                                        <!-- {{comp.url}} -->
                                        <!-- {{comp.url.split('/en/').join('/' + $i18n.locale + '/')}} -->
                                        <video-player 
                                        :source="comp.url.split('/en/').join('/' + $i18n.locale + '/')"
                                            :play-now="false">
                                        </video-player>
                                        <!-- <p v-if="comp.description" class="video-desc">{{ comp.description }}</p> -->
                                    </div>

                                    <!-- MCQ -->
                                    <div v-if="comp.type === 'mcq'" class="comp-mcq">
                                        <div class="mcq-question">{{ comp.question }}</div>
                                        <button v-for="opt in comp.options" :key="opt.id" class="option"
                                            :class="{ selected: answers[slide.id] == opt.id }"
                                            @click="selectOption(slide.id, opt.id)">
                                            <span class="radio" :class="{ on: answers[slide.id] == opt.id }"></span>
                                            <span class="optText">{{ opt.text }}</span>
                                        </button>
                                    </div>

                                    <!-- Open Question -->
                                    <div v-if="comp.type === 'open question'" class="comp-open-question">
                                        <div class="question-label">{{ comp.question }}</div>
                                        <textarea class="textarea" :placeholder="comp.placeholder || $t('components.course.answerPlaceholder')"
                                            v-model="openAnswers[comp.id]"></textarea>
                                    </div>

                                    <!-- List -->
                                    <div v-if="comp.type === 'list'" class="comp-list">
                                        <ul class="ul">
                                            <li v-for="(item, idx) in comp.content.split('\n').filter(i => i.trim())" :key="idx">
                                                {{ item.trim() }}
                                            </li>
                                        </ul>
                                    </div>

                                    <!-- Last Message -->
                                    <div v-if="comp.type === 'last message'" class="comp-last-message">
                                        <div class="message-box">{{ comp.content }}</div>
                                    </div>
                                </div>

                                <!-- End text -->
                                <div v-if="slide.endText" class="end-text">
                                    <p>{{ slide.endText }}</p>
                                </div>

                                <!-- Why this question -->
                                <details v-if="slide.whyThisQuestion" class="why">
                                    <summary>{{ $t('components.course.whyThisQuestion') }}</summary>
                                    <div class="whyBody">{{ slide.whyThisQuestion }}</div>
                                </details>
                            </div>
                            </template>

                        <!-- Completed -->
                        <template v-else-if="slide.type === 'done'">
                            <div class="doneIcon">✅</div>
                            <h2 class="h2">{{ slide.title }}</h2>
                            <p class="p">{{ slide.text }}</p>

                            <div class="panel">
                                <div class="panelTitle">{{ $t('components.course.statusTitle') }}</div>
                                <div class="statusRow">
                                    <span class="statusPill done">{{ $t('components.course.done') }}</span>
                                    <span class="p">{{ $t('components.course.journeyUpdateNote') }}</span>
                                </div>
                            </div>

                        </template>

                    </div>


                </article>
            </div>
        </section>

        <!-- Bottom navigation -->
        <div class="nav">
            <button class="navBtn" :disabled="currentIndex === 0" @click="prev">
                {{ $t('components.course.prev') }}
            </button>

            <div class="dots">
                <span v-for="(s, idx) in slides" :key="s.id" class="dot"
                    :class="{ active: idx === currentIndex }" @click="goTo(idx)"></span>
            </div>

            <button class="navBtn primary" :disabled="needsChoice && !hasAnsweredMCQ" @click="next">
                {{ currentIndex === slides.length - 1 ? $t('components.course.finish') : $t('components.course.next') }}
            </button>
        </div>

        <footer class="footerHint">
            {{ $t('components.course.footerHint') }}
        </footer>
        </template>
    </div>
</template>
