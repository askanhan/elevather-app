<template>
    <div class="simPlay">
        <!-- Error message -->
        <div v-if="error" class="notice notice--error">
            <div class="noticeIcon">⚠️</div>
            <div class="noticeText">{{ error }}</div>
        </div>

        <!-- Loading message -->
        <div v-if="loading" class="notice">
            <div class="spinner"></div>
            <div class="noticeText">{{ $t('components.simulator.play.loading') }}</div>
        </div>

        <!-- Content -->
        <template v-if="!loading && !error">
        <header class="topbar">
            <button class="back" @click="goBack" :aria-label="$t('components.simulator.play.goBack')">←</button>

            <div class="titleWrap">
                <div class="simTitle">{{ scenario.title || $t('components.simulator.title') }}</div>
                <div class="simMeta">
                    <span v-if="scenario.level" class="chip">{{ labelLevel(scenario.level) }}</span>
                    <span class="chip chip--muted">{{ $t('components.simulator.play.stepProgress', { current: stepIndex + 1, total: steps.length }) }}</span>
                </div>
            </div>

            <button class="ghost" @click="restart">{{ $t('components.simulator.play.restart') }}</button>
        </header>

        <!-- Step progress -->
        <div class="progressRow">
            <div class="progressTrack">
                <div class="progressFill" :style="{ width: progressPercent + '%' }"></div>
            </div>
            <span class="progressLabel">{{ progressPercent }}%</span>
        </div>

        <!-- Metrics dashboard -->
        <section class="meters">
            <div class="metersHead">{{ $t('components.simulator.play.yourMetrics') }}</div>
            <div class="meter" v-for="m in meterKeys" :key="m">
                <div class="meterTop">
                    <span class="meterName">{{ m }}</span>
                    <span class="meterVal" :class="meterTone(meters[m])">{{ meters[m] }}</span>
                </div>
                <div class="bar">
                    <div class="fill" :class="meterTone(meters[m])" :style="{ width: meters[m] + '%' }"></div>
                </div>
            </div>
        </section>

        <section class="stage" :style="{ height: stageHeight }">
            <div class="card">
                <div class="card-header-wrapper">
                    <div class="cardHeading">
                        <span v-if="current.kicker" class="kicker">{{ current.kicker }}</span>
                        <h2 class="h2">{{ current.title }}</h2>
                    </div>
                    <audio-button
                        v-if="current"
                        :owner-type="'card'"
                        :owner-id="current.cardId"
                        class="card-audio-button">
                    </audio-button>
                </div>
                <p v-if="current.text" class="p">{{ current.text }}</p>

                <!-- Render card components -->
                <div v-for="comp in current.components" :key="comp.order" class="component">
                    <!-- Text -->
                    <div v-if="comp.type === 'text'" class="comp-text">{{ comp.content }}</div>

                    <!-- Image -->
                    <div v-if="comp.type === 'image'" class="media">
                        <img :src="getImageUrl(comp.url || comp.image, null, 'simulator')" :alt="comp.alt || $t('components.simulator.play.imageAlt')" />
                    </div>

                    <!-- Video -->
                    <div v-if="comp.type === 'video'" class="media">
                        <video-player
                            :source="getVideoUrl(comp.url || comp.video, null, 'simulator')"
                            :play-now="false">
                        </video-player>
                    </div>

                    <!-- MCQ as options -->
                    <div v-if="comp.type === 'mcq'" class="comp-mcq">
                        <div class="mcq-question">{{ comp.question || $t('components.simulator.play.selectOption') }}</div>
                        <button v-for="opt in comp.options" :key="opt.id" class="option"
                            :class="{ selected: selectedAnswers[current.id] == opt.id }"
                            :disabled="locked"
                            @click="choose(opt, comp)">
                            <span class="radio" :class="{ on: selectedAnswers[current.id] == opt.id }"></span>
                            <span class="optText">{{ opt.text }}</span>
                        </button>
                    </div>

                    <!-- Quote -->
                    <div v-if="comp.type === 'quote'" class="comp-quote">
                        <div class="quote-text">"{{ comp.content }}"</div>
                        <div class="quote-author">— {{ comp.author }}</div>
                    </div>
                </div>

                <div v-if="current.why" class="reveal reveal--why">
                    <div class="revealTitle">
                        <span class="revealIcon">💡</span>
                        {{ $t('components.simulator.play.whyItMatters') }}
                    </div>
                    <p class="p">{{ current.why }}</p>
                </div>

                <div v-if="feedback" class="reveal reveal--feedback">
                    <div class="revealTitle">
                        <span class="revealIcon">✅</span>
                        {{ $t('components.feedback.title') }}
                    </div>
                    <p class="p">{{ feedback }}</p>
                </div>

                <details v-if="current.lens" class="lens">
                    <summary>{{ $t('components.simulator.play.powerLens') }}</summary>
                    <div class="whyBody">{{ current.lens }}</div>
                </details>
            </div>
        </section>

        <!-- Debrief Section -->
        <section class="debrief debriefSection" v-if="showDebrief && debriefData">
            <div class="card">
                <div class="debriefHead">
                    <span class="debriefIcon">📊</span>
                    <div>
                        <h2 class="h2 h2--left">{{ $t('components.simulator.play.debriefTitle') }}</h2>
                        <p class="p">{{ $t('components.simulator.play.debriefSubtitle') }}</p>
                    </div>
                </div>

                <!-- Feedbacks list -->
                <div class="feedbacksList">
                    <div v-for="feedback in debriefData" :key="feedback.metric_name" class="feedbackItem">
                        <div class="feedbackHeader">
                            <h3 class="feedbackTitle">{{ feedback.metric_name }}</h3>
                            <span class="feedbackScore">{{ feedback.score }}%</span>
                        </div>

                        <div v-if="feedback.strength" class="feedbackBox strengthBox">
                            <span class="feedbackIcon">💪</span>
                            <div>
                                <div class="feedbackLabel">{{ $t('components.simulator.play.strength') }}</div>
                                <p class="feedbackText">{{ feedback.strength }}</p>
                            </div>
                        </div>

                        <div v-if="feedback.risk" class="feedbackBox riskBox">
                            <span class="feedbackIcon">⚠️</span>
                            <div>
                                <div class="feedbackLabel">{{ $t('components.simulator.play.areaToDevelop') }}</div>
                                <p class="feedbackText">{{ feedback.risk }}</p>
                            </div>
                        </div>

                        <div v-if="feedback.practice" class="feedbackBox practiceBox">
                            <span class="feedbackIcon">🎯</span>
                            <div>
                                <div class="feedbackLabel">{{ $t('components.simulator.play.microPractice') }}</div>
                                <p class="feedbackText">{{ feedback.practice }}</p>
                            </div>
                        </div>

                        <div v-if="feedback.recommendation && feedback.recommendation.reason" class="feedbackBox recommendationBox">
                            <span class="feedbackIcon">📚</span>
                            <div>
                                <div class="feedbackLabel">{{ $t('components.simulator.play.recommendedModule') }}</div>
                                <p class="feedbackText">{{ feedback.recommendation.reason }}</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Bottom navigation with dots -->
        <div class="nav">
            <button class="navBtn" :disabled="stepIndex === 0 || showDebrief" @click="prev">
                {{ $t('components.simulator.play.prev') }}
            </button>

            <div class="dots">
                <span v-for="(s, idx) in steps" :key="s.id" class="dot"
                    :class="{ active: idx === stepIndex }" @click="goTo(idx)"></span>
            </div>

            <!-- Finish button (debrief page) -->
            <button v-if="showDebrief" class="navBtn primary" @click="finishAndNavigate">
                {{ $t('components.simulator.play.finish') }}
            </button>

            <!-- Next/Show result button -->
            <button v-else class="navBtn primary"
                :disabled="(stepIndex === steps.length - 1 ? debriefLoading : (needsChoice && !feedback))"
                @click="stepIndex === steps.length - 1 ? showResultsDebrief() : next()">
                {{ stepIndex === steps.length - 1 ? (debriefLoading ? $t('components.simulator.play.loadingShort') : $t('components.simulator.play.showResult')) : $t('components.simulator.play.next') }}
            </button>
        </div>
        </template>
    </div>
</template>
