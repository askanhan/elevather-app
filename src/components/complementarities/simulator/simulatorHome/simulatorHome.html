<template>
    <div class="simHome">
        <header class="head">
            <div>
                <h1 class="h1">{{ $t('components.simulator.title') }}</h1>
                <p class="sub">
                    {{ $t('components.simulator.home.subtitle') }}
                </p>
            </div>

            <div class="tools">
                <input v-model="query" class="search" type="search" :placeholder="$t('components.simulator.home.searchPlaceholder')" />
                <select v-model="level" class="select">
                    <option value="all">{{ $t('components.simulator.home.allLevels') }}</option>
                    <option v-for="lvl in levels" :key="lvl.value" :value="lvl.value">
                        {{ lvl.label }}
                    </option>
                </select>
            </div>
        </header>

        
        <div v-if="error" class="error-message">
            ⚠️ {{ error }}
        </div>

        
        <div v-if="loading" class="loading">
            {{ $t('components.simulator.home.loading') }}
        </div>

        
        <section v-if="!loading" class="grid">
            <article v-for="s in filtered" :key="s.id" class="card" @click="goPlay(s)">
                <div class="top">
                    <div class="icon">{{ s.icon }}</div>
                    <div class="meta">
                        <div class="title">{{ s.title }}</div>
                        <div class="desc">{{ s.description }}</div>

                        <div class="chips">
                            <span class="chip">{{ labelLevel(s.level) }}</span>
                            <span class="chip">{{ s.duration }}</span>
                            <span class="chip">{{ s.domain }}</span>
                        </div>

                        <div class="tags">
                            <p class="label">{{ $t('components.simulator.home.focusSkills') }}</p>
                            <div class="tags-list">
                                <span v-for="t in s.tags" :key="t" class="tag">{{ t }}</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bottom">
                    <button class="btn">{{ $t('components.simulator.home.startSimulation') }}</button>
                </div>
            </article>
        </section>

        <!-- if no results -->
        <p v-if="!loading && filtered.length === 0" class="note">
            {{ $t('components.simulator.home.noResults') }}
        </p>
    </div>
</template>
