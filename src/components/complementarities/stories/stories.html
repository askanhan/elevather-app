<template>
    <div class="sm">

        <header class="head">
            <div>
                <h1 class="h1">{{ $t('components.stories.title') }}</h1>
                <p class="sub">
                    {{ $t('components.stories.subtitle1') }}
                </p>
                <p class="sub">
                    {{ $t('components.stories.subtitle2') }}
                </p>
            </div>

            <div class="tools" v-if="!isGuest">
                <input v-model="query" class="search" type="search" :placeholder="$t('components.stories.searchPlaceholder')" />

                <!-- <button class="filterBtn" :class="{ active: showUserStoriesOnly }" @click="toggleUserStoriesOnly">
                    <span class="filterIcon">👤</span>
                    My Stories
                </button> -->
            </div>
        </header>

        <section class="section" v-if="!isGuest">

            <!-- Community tabs: Community Stories / Share your story -->
            <div class="subtabs">
                <button class="subtab" :class="{ on: storiesTab === 'real' }" @click="storiesTab = 'real'">
                    {{ $t('components.stories.tabs.real') }}
                </button>
                <button class="subtab" :class="{ on: storiesTab === 'share' }" @click="storiesTab = 'share'">
                    {{ $t('components.stories.tabs.share') }}
                </button>
            </div>
            <!-- Real Stories feed -->
            <div v-if="storiesTab === 'real'" class="realStories">

                <div class="sectionHead">
                  <h2 class="h2">{{ $t('components.stories.realSection.title') }}</h2>
                  <p class="hint">{{ $t('components.stories.realSection.hint') }}</p>
                </div>
              
                <div v-if="filteredPool.length === 0" class="noPendingStories">
                    <p>{{ $t('components.stories.emptyFeed.title') }}</p>
                    <p class="sub">{{ $t('components.stories.emptyFeed.sub') }}</p>
                </div>

                <div v-else class="feed">
                  <article v-for="p in filteredPool" :key="p.id" class="post">
              
                    <!-- Story = hero -->
                    <p class="postText">{{ p.content || p.text }}</p>
              
                    <!-- Tags (if any) -->
                    <div v-if="p.tags && p.tags.length" class="tagRow">
                      <span v-for="t in p.tags" :key="t" class="tag">{{ t }}</span>
                    </div>
              
                    <!-- Subtle meta line -->
                    <div class="postMeta">
                      <span class="metaItem">
                        <span class="anonDot"></span>
                        {{ p.author || $t('components.stories.anonymous') }}
                      </span>
                      <span class="metaSep">·</span>
                      <span class="metaItem">{{ p.track || p.category?.title }}</span>
                      <span class="metaSep">·</span>
                      <span class="metaItem">{{ getStoryContext(p) }}</span>
                      <span class="metaSep">·</span>
                      <span class="metaItem">{{ formatStoryDate(p.when || p.created_at) }}</span>

                      <button
                        v-if="isOwnStory(p)"
                        class="deleteBtn"
                        @click="deleteStory(p.id)"
                        :title="$t('components.stories.deleteStoryTitle')"
                      >
                        🗑️
                      </button>
                    </div>

                    <!-- Reactions -->
                    <div class="postActions">
                      <button
                        class="pillBtn"
                        :class="{ on: reacted(p.id, 'relatable') }"
                        @click="toggleReaction(p.id, 'relatable')"
                      >
                        <span class="ic">🤝</span>
                        <span>{{ $t('components.stories.relate') }}</span>
                        <span class="count">{{ p.reactions_count?.relatable || p.relate || 0 }}</span>
                      </button>

                      <button
                        class="pillBtn"
                        :class="{ on: reacted(p.id, 'support') }"
                        @click="toggleReaction(p.id, 'support')"
                      >
                        <span class="ic">💗</span>
                        <span>{{ $t('components.stories.support') }}</span>
                        <span class="count">{{ p.reactions_count?.support || p.support || 0 }}</span>
                      </button>
                    </div>
                  </article>
                </div>
              </div>

            <!-- Share your story -->
            <div v-if="storiesTab === 'share'" class="shareStory">

                <div class="sectionHead">
                    <h2 class="h2">{{ $t('components.stories.tabs.share') }}</h2>
                    <p class="hint">
                        {{ $t('components.stories.shareHint') }}
                    </p>
                </div>

                <div class="shareCard">
                    <div class="anonBanner">
                        <span class="anonShield">🛡️</span>
                        <div class="anonBannerTxt">
                            <div class="anonTitle">{{ $t('components.stories.privacyTitle') }}</div>
                            <div class="anonDesc">{{ $t('components.stories.privacyDesc') }}</div>
                        </div>
                    </div>

                    <label class="lbl">{{ $t('components.stories.yourOneLiner') }}</label>
                    <textarea v-model="newStory.text" class="ta" maxlength="220"
                        :placeholder="$t('components.stories.oneLinerPlaceholder')"></textarea>

                    <div class="row">

                        <div class="field">
                            <label class="lbl">{{ $t('components.stories.contextLabel') }}</label>
                            <select v-model="newStory.context" class="select2">
                                <option value="Work">{{ $t('components.stories.context.work') }}</option>
                                <option value="Family">{{ $t('components.stories.context.family') }}</option>
                                <option value="Community">{{ $t('components.stories.context.community') }}</option>
                                <option value="Self">{{ $t('components.stories.context.self') }}</option>
                            </select>
                        </div>
                        <div class="field">
                            <label class="lbl">{{ $t('components.stories.aboutLabel') }}</label>
                            <select v-model="newStory.track" class="select2">
                                <option value="" disabled>{{ $t('components.stories.selectTrack') }}</option>
                                <option v-for="cat in trackOptions" :key="cat.id" :value="cat.name || cat.title">
                                    {{ cat.name || cat.title }}
                                </option>
                            </select>
                        </div>
                    </div>

                    <div class="shareBottom">
                        <div class="counter">{{ (newStory.text || '').length }}/220</div>
                        <div class="buttonsGroup">
                            <button class="send" :disabled="!canSend" @click="submitStory">
                                {{ $t('components.stories.shareAnonymously') }}
                            </button>
                        </div>
                    </div>

                    <div v-if="sent" class="sent">
                        {{ $t('components.stories.submittedMessage') }}
                    </div>

                    <div v-if="storySubmitError" class="error">
                        ❌ {{ storySubmitError }}
                    </div>
                </div>
                <!-- Pending Stories tab -->
                <div class="pendingStories mt-5">

                    <div class="sectionHead">
                        <h2 class="h2">{{ $t('components.stories.pendingSection.title') }}</h2>
                        <p class="hint">
                            {{ $t('components.stories.pendingSection.hint') }}
                        </p>
                    </div>

                    <div v-if="pendingStoriesList.length === 0" class="noPendingStories">
                        <p>{{ $t('components.stories.pendingSection.emptyTitle') }}</p>
                        <p class="sub">{{ $t('components.stories.pendingSection.emptySub') }}</p>
                    </div>

                    <div v-else class="feed">
                        <article v-for="p in pendingStoriesList" :key="p.id" class="post pending">
                            <div class="statusBadge">{{ $t('components.stories.pendingSection.badge') }}</div>

                            <div class="postBody">
                                <div class="postText">{{ p.content || p.text }}</div>

                                <div v-if="p.tags && p.tags.length" class="tagRow">
                                    <span v-for="t in p.tags" :key="t" class="tag">{{ t }}</span>
                                </div>
                            </div>

                            <div class="postHead">
                                <div class="anon">
                                    <span class="anonDot"></span>
                                    <span class="anonTxt">{{ p.author || $t('components.stories.anonymous') }}</span>
                                </div>
                                <div class="postMeta">
                                    <span class="chip">{{ p.track || p.category?.title }}</span>
                                    <span class="chip">{{ getStoryContext(p) }}</span>
                                    <span class="chip">{{ p.when || p.created_at }}</span>
                                    <button class="deleteBtn" @click="deleteStory(p.id)" :title="$t('components.stories.deleteStoryTitle')">
                                        🗑️
                                    </button>
                                </div>
                            </div>
                        </article>
                    </div>
                </div>
            </div>


        </section>

        <!-- Error Modal Popup -->
        <div v-if="showErrorModal" class="errorModalOverlay" @click="closeErrorModal">
            <div class="errorModalContent" @click.stop>
                <div class="errorModalIcon">✨</div>
                <div class="errorModalMessage">{{ errorModalMessage }}</div>
                <button class="errorModalBtn" @click="closeErrorModal">
                    {{ $t('components.stories.errorModal.understand') }}
                </button>
            </div>
        </div>

        <!-- Delete Confirmation Modal (integrated in page, not browser dialog) -->
        <div v-if="showDeleteModal" class="modalOverlay">
            <div class="modalContent">
                <div class="modalHeader">
                    <h3>{{ $t('components.stories.deleteModal.title') }}</h3>
                </div>
                <div class="modalBody">
                    <p>{{ $t('components.stories.deleteModal.body') }}</p>
                    <p class="modalWarn">{{ $t('components.stories.deleteModal.warn') }}</p>
                </div>
                <div class="modalFooter">
                    <button class="modalCancel" @click="cancelDelete">
                        {{ $t('common.cancel') }}
                    </button>
                    <button class="modalDelete" @click="confirmDeleteStory">
                        {{ $t('components.stories.deleteModal.title') }}
                    </button>
                </div>
            </div>
        </div>

    </div>
</template>
